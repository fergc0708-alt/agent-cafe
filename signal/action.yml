name: Signal — was it the dependency update?
description: "On a red Renovate/Dependabot PR: re-runs the tests with and without the update on the same runner and tells you which tests the update breaks, which were already failing, or that a test is flaky. Runs locally, needs no token, sends nothing."
branding:
  icon: crosshair
  color: orange
inputs:
  install:
    description: "Install command for each side (default: detected from the lockfile: npm ci / pnpm install --frozen-lockfile / yarn install --frozen-lockfile|--immutable)"
    default: ""
  test:
    description: "Test command (default: the package.json test script)"
    default: ""
  working-directory:
    description: "Project directory inside the repository (monorepos: a lockfile at the root is found)"
    default: "."
  junit:
    description: "Path (relative to the project) of a JUnit XML report your test command writes, for exact test names"
    default: ""
  retries:
    description: "Re-runs of a failing side, to tell flaky tests from real failures (0-3)"
    default: "1"
  timeout-minutes:
    description: "Per install/test command"
    default: "20"
  isolate:
    description: "In grouped PRs, search for the responsible update (extra runs, bounded by isolate-budget)"
    default: "true"
  isolate-budget:
    description: "Max extra test runs spent on that search"
    default: "8"
  fail-on:
    description: "regression = fail this job on a high-confidence regression; never = report only"
    default: "never"
  redact:
    description: "Show error shapes instead of full messages in the summary (public repositories)"
    default: "false"
outputs:
  verdict:
    description: "regression | regression_on_red | pre_existing | flaky | compatible | inconclusive"
    value: ${{ steps.signal.outputs.verdict }}
  confidence:
    description: "high | medium | low"
    value: ${{ steps.signal.outputs.confidence }}
  culprit:
    description: "Responsible package when it was isolated (or the only updated one)"
    value: ${{ steps.signal.outputs.culprit }}
runs:
  using: composite
  steps:
    - id: signal
      shell: bash
      env:
        S_INSTALL: ${{ inputs.install }}
        S_TEST: ${{ inputs.test }}
        S_WD: ${{ inputs.working-directory }}
        S_JUNIT: ${{ inputs.junit }}
        S_RETRIES: ${{ inputs.retries }}
        S_TIMEOUT: ${{ inputs.timeout-minutes }}
        S_ISOLATE: ${{ inputs.isolate }}
        S_BUDGET: ${{ inputs.isolate-budget }}
        S_FAIL: ${{ inputs.fail-on }}
        S_REDACT: ${{ inputs.redact }}
        S_HOME: ${{ github.action_path }}
      run: |
        set -euo pipefail
        command -v node >/dev/null || { echo "::error::Signal needs Node.js >= 20 on PATH (actions/setup-node)"; exit 1; }
        major=$(node -p 'process.versions.node.split(".")[0]')
        [ "$major" -ge 20 ] || { echo "::error::Signal needs Node.js >= 20 (found $(node --version))"; exit 1; }
        # The PR merge commit's first parent is the exact base the PR is tested against.
        [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3 ] || git fetch --no-tags --depth=2 origin "$GITHUB_SHA" >/dev/null 2>&1 || true
        args=(signal diagnose --dir "$S_WD" --retries "$S_RETRIES" --timeout-minutes "$S_TIMEOUT" --isolate-budget "$S_BUDGET" --fail-on "$S_FAIL")
        [ -n "$S_INSTALL" ] && args+=(--install "$S_INSTALL")
        [ -n "$S_TEST" ] && args+=(--test "$S_TEST")
        [ -n "$S_JUNIT" ] && args+=(--junit "$S_JUNIT")
        [ "$S_ISOLATE" = "true" ] || args+=(--no-isolate)
        [ "$S_REDACT" = "true" ] && args+=(--redact)
        node "$S_HOME/../dist/cli/cafe.js" "${args[@]}"
