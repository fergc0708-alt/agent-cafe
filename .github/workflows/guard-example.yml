name: Agent Café guard (example project)
# Dogfoods the action on examples/legacy-app, which deliberately uses removed APIs.
on:
  push:
    branches: ["goat/**", "main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: "20", python: "3.11" }
          - { node: "24", python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: ./
        with:
          path: examples/legacy-app
          fail-on: never
