name: Signal end-to-end
# Real npm packages, real lockfiles, a real dependency-update PR against goat/* branches. Each example has a
# known expected diagnosis; the job fails if Signal says anything else.
on:
  pull_request:
    branches: ["goat/**"]
    paths: ["examples/signal/**", "signal/**", "dist/signal/**", ".github/workflows/signal-e2e.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: examples/signal/grouped, verdict: regression, culprit: chalk }
          - { dir: examples/signal/red-main, verdict: regression_on_red, culprit: chalk }
          - { dir: examples/signal/compatible, verdict: compatible, culprit: "" }
          - { dir: examples/signal/flaky, verdict: flaky, culprit: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - id: signal
        uses: ./signal
        with:
          working-directory: ${{ matrix.dir }}
      - name: Signal must reach the expected diagnosis
        env:
          GOT: ${{ steps.signal.outputs.verdict }}
          CULPRIT: ${{ steps.signal.outputs.culprit }}
          WANT: ${{ matrix.verdict }}
          WANT_CULPRIT: ${{ matrix.culprit }}
        run: |
          echo "verdict=$GOT culprit=$CULPRIT"
          test "$GOT" = "$WANT"
          test "$CULPRIT" = "$WANT_CULPRIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git worktree list | wc -l)" = "1"
  refuses-persisted-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 2 }   # default persist-credentials: true -> Signal must refuse to run project code
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - id: signal
        continue-on-error: true
        uses: ./signal
        with:
          working-directory: examples/signal/compatible
      - run: test "${{ steps.signal.outcome }}" = "failure"
