name: Café Signal end-to-end
# Real paired experiment on a real dependency-update PR against goat/* branches (examples/signal-demo), then a real
# GitHub OIDC token is minted for the observation and verified by a local Signal service against GitHub's live keys.
on:
  pull_request:
    branches: ["goat/**"]
    paths: ["examples/signal-demo/**", "signal/**", "dist/signal/**"]
permissions:
  contents: read
  id-token: write
jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Start a local Café Signal service (self-hosted mode)
        run: |
          node dist/cli/cafe.js signal serve --port 8787 > /tmp/signal-serve.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:8787/api/signal/v1/query >/dev/null && break; sleep 1; done
      - id: signal
        uses: ./signal
        with:
          working-directory: examples/signal-demo
          install: npm ci --ignore-scripts --no-audit --no-fund
          test: npm test
          share: "true"
          endpoint: http://localhost:8787
          share-public: "true"
      - name: The update must be attributed, shared with a verified identity, and queryable
        env:
          ATTR: ${{ steps.signal.outputs.attribution }}
        run: |
          echo "attribution=$ATTR"
          q=$(curl -s "localhost:8787/api/signal/v1/query?ecosystem=npm&package=chalk&from=4.1.2&to=5.3.0")
          echo "$q" | head -c 1500
          cat /tmp/signal-serve.log
