name: Signal end-to-end
# Real npm packages and real lockfiles. Each job builds the dependency-update commit itself (npm resolves the new
# versions from the registry, as Renovate would), then runs the Action on it. Each example has a known expected
# diagnosis; the job fails if Signal says anything else. Runs on any PR or push that touches Signal.
on:
  pull_request:
    paths: ["examples/signal/**", "signal/**", "dist/signal/**", ".github/workflows/signal-e2e.yml"]
  push:
    branches: ["goat/**"]
    paths: ["examples/signal/**", "signal/**", "dist/signal/**", ".github/workflows/signal-e2e.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: examples/signal/grouped, update: "chalk@5.3.0 ms@2.1.3 semver@7.6.3", verdict: regression, culprit: chalk }
          - { dir: examples/signal/red-main, update: "chalk@5.3.0 ms@2.1.3 semver@7.6.3", verdict: regression_on_red, culprit: chalk }
          - { dir: examples/signal/compatible, update: "ms@2.1.3", verdict: compatible, culprit: "" }
          - { dir: examples/signal/flaky, update: "ms@2.1.3", verdict: flaky, culprit: "" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: Build the dependency-update commit (as a bot would)
        working-directory: ${{ matrix.dir }}
        env:
          UPDATE: ${{ matrix.update }}
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund $UPDATE
          git -c user.email=bot@example.com -c user.name=bot commit -qam "Update dependencies ($UPDATE)"
          git show --stat --oneline HEAD
      - id: signal
        uses: ./signal
        with:
          working-directory: ${{ matrix.dir }}
          base: HEAD~1
          ci-context: "false"
      - name: Signal must reach the expected diagnosis
        env:
          GOT: ${{ steps.signal.outputs.verdict }}
          CULPRIT: ${{ steps.signal.outputs.culprit }}
          WANT: ${{ matrix.verdict }}
          WANT_CULPRIT: ${{ matrix.culprit }}
        run: |
          echo "verdict=$GOT culprit=$CULPRIT"
          test "$GOT" = "$WANT"
          test "$CULPRIT" = "$WANT_CULPRIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git worktree list | wc -l)" = "1"
          test ! -e "${{ matrix.dir }}/node_modules"
  refuses-persisted-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 2 }   # default persist-credentials: true -> Signal must refuse to run project code
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: |
          cd examples/signal/compatible
          npm install --package-lock-only --ignore-scripts --save-exact --no-audit --no-fund ms@2.1.3
          git -c user.email=bot@example.com -c user.name=bot commit -qam "Update ms"
      - id: signal
        continue-on-error: true
        uses: ./signal
        with:
          working-directory: examples/signal/compatible
          base: HEAD~1
          ci-context: "false"
      - run: test "${{ steps.signal.outcome }}" = "failure"
